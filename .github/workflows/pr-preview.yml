name: PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'public/**'
      - '.github/workflows/pr-preview.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-pr-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PR Preview to gh-pages/pr-preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: pr-preview/pr-${{ github.event.number }}
          keep_files: true

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/pr-${prNumber}/`;
            const body = [
              `### PR Preview Deployed`,
              `- **Preview URL**: ${previewUrl}`,
              `- **Commit**: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `- 리뷰어는 위 링크에서 UI 변경 사항을 병합 전에 확인할 수 있습니다.`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
