name: Collect DORA Metrics & Weekly Report

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dora-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect DORA 4 Metrics to JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p metrics
          node scripts/collect-dora.js > metrics/dora-metrics.json

      - name: Upload DORA JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-json
          path: metrics/dora-metrics.json

      - name: Generate & Commit Weekly Report
        run: |
          node scripts/generate-report.js metrics/dora-metrics.json > docs/DORA_WEEKLY_REPORT.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain metrics/dora-metrics.json docs/DORA_WEEKLY_REPORT.md)" ]; then
            git checkout -B chore/dora-weekly-report
            git add metrics/dora-metrics.json docs/DORA_WEEKLY_REPORT.md
            git commit -m "docs(dora): update weekly DORA metrics report"
            git push -f origin chore/dora-weekly-report
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr view chore/dora-weekly-report >/dev/null 2>&1 || \
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr create --base main --head chore/dora-weekly-report --title "docs(dora): update weekly DORA metrics report" --body "자동 수집된 주간 DORA 4대 지표 리포트입니다." || true
          fi
          cat docs/DORA_WEEKLY_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
